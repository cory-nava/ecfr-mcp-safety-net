name: Rebuild data from ecfr-markdown-safety-net

# Triggered by ctrimm/ecfr-markdown-safety-net whenever its corpus changes on main (a
# merged sync PR), or manually. Rebuilds data/ (vectors, chunks, metadata,
# corpus tarball) from that exact ecfr-markdown-safety-net commit, runs the test suite
# against the rebuilt data, and opens a pull request with the result.

on:
  repository_dispatch:
    types: [corpus-updated]
  workflow_dispatch:
    inputs:
      corpus_sha:
        description: "ecfr-markdown-safety-net commit to build from (default: its current main)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the ecfr-markdown-safety-net commit
        id: src
        run: |
          sha="${{ github.event.client_payload.ecfr_markdown_sha || inputs.corpus_sha }}"
          if [ -z "$sha" ]; then
            sha=$(git ls-remote https://github.com/ctrimm/ecfr-markdown-safety-net.git refs/heads/main | cut -f1)
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=${sha:0:7}" >> "$GITHUB_OUTPUT"

      - name: Check out ecfr-markdown-safety-net at that commit
        uses: actions/checkout@v4
        with:
          repository: ctrimm/ecfr-markdown-safety-net
          ref: ${{ steps.src.outputs.sha }}
          path: corpus-src

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: build/requirements.txt

      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bge-small-en-v1.5

      - name: Install build dependencies
        run: pip install -r build/requirements.txt

      - name: Rebuild data/
        run: |
          python build/build_vectors.py --corpus corpus-src/corpus --out data \
            --snapshot "ctrimm/ecfr-markdown-safety-net @ ${{ steps.src.outputs.sha }} (automated rebuild)"
          python build/build_chunks.py --corpus corpus-src/corpus --out data
          python build/pack_corpus.py --corpus corpus-src/corpus --out data

      - name: Run the test suite against the rebuilt data
        run: python -m unittest discover -s tests -t .

      - name: Read the new manifest
        id: manifest
        run: |
          echo "vectors=$(jq -r .vectors data/manifest.json)" >> "$GITHUB_OUTPUT"
          echo "meta_rows=$(jq -r .meta_rows data/manifest.json)" >> "$GITHUB_OUTPUT"
          echo "chunks=$(jq -r .chunks data/manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Rebuild data/ from ecfr-markdown-safety-net @ ${{ steps.src.outputs.short }}"
          branch: data-rebuild/${{ steps.src.outputs.short }}
          title: "Rebuild data/ from ecfr-markdown-safety-net @ ${{ steps.src.outputs.short }}"
          body: |
            Automated rebuild of `data/` from [ctrimm/ecfr-markdown-safety-net@${{ steps.src.outputs.short }}](https://github.com/ctrimm/ecfr-markdown-safety-net/commit/${{ steps.src.outputs.sha }}).

            New index: ${{ steps.manifest.outputs.vectors }} sections, ${{ steps.manifest.outputs.meta_rows }} metadata rows (incl. historical versions), ${{ steps.manifest.outputs.chunks }} chunks.

            The full test suite passed against this rebuilt data in the workflow run. If the corpus did not actually change, this PR will be empty and can be closed.
          delete-branch: true
